services:

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: public_user
      POSTGRES_PASSWORD: publicN3xt!
      POSTGRES_DB: public_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  order-management:
    build:
      context: ./order-management
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      DATABASE_HOST: postgres
      LOGGING_SERVICE_URL: http://logging-service:9091
    depends_on:
      - postgres

  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: public_user
      MONGO_INITDB_ROOT_PASSWORD: publicN3xt!
      MONGO_INITDB_DATABASE: public_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  logging-service:
    build:
      context: ./logging-service
      dockerfile: Dockerfile
    ports:
      - "9091:9091"
    environment:
      DATABASE_HOST: mongo
    depends_on:
      - mongo

volumes:
  postgres_data:
  mongo_data: